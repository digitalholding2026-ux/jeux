name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/build-android.yml"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android debug (IL2CPP, ARMv7 + ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.23f1
          targetPlatform: Android
          androidBuildType: Development
          androidExportType: androidPackage
          androidMinSdkVersion: 23
          androidTargetSdkVersion: 36
          # Le builder game-ci génère l'APK dans build/Android (voir CI_SETUP.md §4).

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: colorflow-debug-apk
          path: build/Android
          if-no-files-found: error
          retention-days: 14
